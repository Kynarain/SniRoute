# EA 前端（www.ea.com / ea.com）：本机终结 TLS，上游发真 SNI、用 HTTP/1.1。
#
# 为什么不用 dns 模式直接直连：Chrome 直连 Akamai 边缘时报 ERR_HTTP2_PROTOCOL_ERROR
# （强制 h1.1 又变成连接重置），而 curl（schannel、h1.1）能拿到 200 —— 问题出在
# 客户端与边缘的协议协商，不是网络不通。让 nginx 用自己的栈连上游可以绕开。

upstream ea_edge {
    server 23.55.208.196:443 max_fails=2 fail_timeout=15s;
    server 23.15.140.190:443 max_fails=2 fail_timeout=15s;
    server 23.222.30.191:443 max_fails=2 fail_timeout=15s;
    keepalive 8;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name www.ea.com ea.com;

    ssl_certificate     certs/eaexp.crt;
    ssl_certificate_key certs/eaexp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass https://ea_edge;
        proxy_ssl_server_name on;
        proxy_ssl_name www.ea.com;
        proxy_set_header Host $host;
        include incl/proxy-params-community.conf;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}