# 图片站（*.pximg.net）。
#
# 单独一张证书、单独一个 upstream —— 见 nginx.conf 顶部关于 421 的说明：
# 只要这张证书的 SAN 里不出现 *.pixiv.net，浏览器就没有理由把它和主站的
# 连接合并成一条，上游也就看不到"SNI 与 Host 不一致"这种请求。

upstream pximg_img {
    include upstreams/pximg.list;

    # 图片站并发高、单张可能很大，保持更多空闲连接能省掉反复握手的开销
    keepalive 32;
    keepalive_timeout 120s;
    keepalive_requests 1000;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name pximg.net *.pximg.net;

    ssl_certificate     certs/pximg.crt;
    ssl_certificate_key certs/pximg.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://pximg_img;

        proxy_ssl_server_name off;
        #proxy_ssl_server_name on;
        #proxy_ssl_name i.pximg.net;

        include incl/proxy-params.conf;

        # 图床按 Referer 判断来源。浏览器从 pixiv 页面加载图片时本来就会带，
        # 但直接打开图片地址（新标签页、收藏夹）时不会，于是被拒。
        # 这一行让两种情况都能出图；写在 include 之后，因此覆盖它。
        proxy_set_header Referer https://www.pixiv.net/;

        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
