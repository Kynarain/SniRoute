# X 的图片/静态/视频 CDN（pbs / abs / video.twimg.com）
#
# 模式：本机终结 TLS（loopback），但和别的 loopback 站点不同——上游不是"不发 SNI"，
# 而是**发另一个不被拦的 SNI**：twimg.twitter.map.fastly.net。
#
# 为什么不发空 SNI：Fastly 对无 SNI 的请求直接回 400，Host 再对也没用。
# 为什么不用真 SNI：pbs.twimg.com 这类精确域名在 ClientHello 后 ~115ms 就被重置。
# Fastly 的 map 名不在封锁名单里，同一个 IP 上发它就能拿到真实字节：
#   pbs   -> 200 image/jpeg 25,958 字节（JPEG 头 ffd8ff）
#   abs   -> 200 image/png 13,160 字节（PNG 头 89504e47）
#   video -> 200 application/x-mpegURL 1,679 字节（以 #EXTM3U 开头）
#
# 注意：X 的样式和脚本都在 abs.twimg.com，所以这三个域名必须一起接管，
# 少一个页面就没有样式。

upstream twimg_edge {
    include upstreams/twimg.list;

    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 300;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name pbs.twimg.com abs.twimg.com video.twimg.com;

    ssl_certificate     certs/twimg.crt;
    ssl_certificate_key certs/twimg.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://twimg_edge;

        # 关键两行：SNI 用 Fastly 的 map 名（不被拦），Host 保留原始域名（由 Fastly 路由）
        proxy_ssl_server_name on;
        proxy_ssl_name twimg.twitter.map.fastly.net;
        include incl/proxy-params-twimg.conf;
    }
}
