# pixiv 主站与 API。
#
# 上游地址不写在配置里，而是由 scripts/sniroute.py discover/probe 生成到
# upstreams/pixiv.list。手工改那份文件也能生效，只是下次 probe 会覆盖它。
#
# 实测结论（2026-11-18，见 README「实测记录」）：
#   www.pixiv.net 在 Cloudflare 后面。连 CF 边缘并发送真实 SNI 可以正常握手、
#   证书校验通过 —— 所以这里必须 proxy_ssl_server_name on。
#   早先那批 210.140.139.x 是 pixiv 的老源站，直连它无 SNI 会 301/403、带 SNI
#   会被重置；两条现象都只针对旧源站，不针对 Cloudflare 边缘。

upstream pixiv_www {
    include upstreams/pixiv.list;

    keepalive 16;
    keepalive_timeout 120s;
    keepalive_requests 1000;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name pixiv.net www.pixiv.net;

    ssl_certificate     certs/pixiv.crt;
    ssl_certificate_key certs/pixiv.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://pixiv_www;

        # 上游是否带 SNI —— 这个站点必须打开。
        #
        # 原因很具体：上游是 Cloudflare 边缘，CF 靠 SNI 判断请求属于哪个站点。
        # 不发 SNI，CF 只能按 Host 猜，结果就是 403 / 421；发了 SNI，一切正常。
        # 实测中这两条都验证过，不是推测。
        proxy_ssl_server_name on;
        # 用用户实际访问的域名做 SNI：pixiv.net 和 www.pixiv.net 都在同一 zone 里
        proxy_ssl_name $host;

        include incl/proxy-params.conf;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
