# Steam 头像（avatars.steamstatic.com）
#
# 模式：本机终结 TLS，上游不发 SNI。
# 原因：这个域名带 SNI 会被重置，而不发 SNI 的请求能拿到真实头像（200 image/jpeg）。
# 同一个 IP 换别的 SNI 就能通，说明规则针对的是这个域名本身。
#
# 注意：steamstatic.com 的其他子域（cdn./community./store.cloudflare.）带 SNI 是正常的，
# 它们在 steam 站点里走 dns 模式，不要并入这里。

upstream steamavatars_edge {
    include upstreams/steamavatars.list;

    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 500;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name avatars.steamstatic.com;

    ssl_certificate     certs/steamavatars.crt;
    ssl_certificate_key certs/steamavatars.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://steamavatars_edge;

        proxy_ssl_server_name off;

        # 头像请求量很大、单个很小，超时收紧以便坏上游能被快速跳过
        include incl/proxy-params-community.conf;

        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
