# MEGA 存储 API（g.api.mega.co.nz）
#
# 模式：本机终结 TLS，上游不发 SNI（proxy_ssl_server_name off），靠 Host 头路由。
# 原因：带 SNI 被重置；无 SNI 时 POST /cs 能拿到真实的空 body（"-2" 表示未提供会话）
#
# 上游地址：conf/upstreams/megaapi.list（实测可用的边缘，失效时用
# scripts\sniroute.py site <域名> 重新探测）

upstream megaapi_edge {
    include upstreams/megaapi.list;

    keepalive 8;
    keepalive_timeout 60s;
    keepalive_requests 300;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name g.api.mega.co.nz;

    ssl_certificate     certs/megaapi.crt;
    ssl_certificate_key certs/megaapi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://megaapi_edge;

        proxy_ssl_server_name off;

        include incl/proxy-params-slow.conf;
    }
}
