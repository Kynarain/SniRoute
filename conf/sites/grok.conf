# Grok（grok.com）与 xAI（x.ai）
#
# 模式：本机终结 TLS（loopback），上游发**带根点的 SNI**（grok.com. / x.ai.），Host 原样透传。
#
# 为什么：
#   · 精确 SNI 在 ClientHello 后 27-40 毫秒就被重置（本网注入），浏览器拿不到任何响应；
#   · 不带 SNI 会被 Cloudflare 拒绝（handshake_failure），所以不能用 proxy_ssl_server_name off；
#   · 带根点的写法 GFW 不拦（同一台 IP 交错对照：grok.com RST / grok.com. 200 稳定复现）。
#
# 注意：CF 按 SNI 分区，SNI 与 Host 不同名会回 403，所以不能"只换 Host"。
# 地址：conf/upstreams/grok.list（失效时用 scripts\sniroute.py site grok.com 重测）

# 注意：这里**故意不配置 keepalive**。
# 这几个站点给每个域名发不同的 SNI（带根点），而 nginx 的上游连接池会跨请求复用同一条
# TLS 连接 —— 复用时不重新握手，SNI 还是上一条的，Cloudflare 就会回 421 Misdirected Request。
# 实测去掉连接池后恢复正常，代价是每个请求重新握手（可以接受）。
upstream grok_edge {
    include upstreams/grok.list;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name grok.com *.grok.com x.ai *.x.ai;

    ssl_certificate     certs/grok.crt;
    ssl_certificate_key certs/grok.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://grok_edge;

        proxy_ssl_server_name on;
        proxy_ssl_name $host.;
        # 关掉 TLS 会话复用：这些站点每条请求的 SNI 可能不同，复用别的域名
        # 的会话会让 Cloudflare 回 421 Misdirected Request（实测约一半请求中招）。
        proxy_ssl_session_reuse off;          # 带根点，绕过按精确域名的封锁
        proxy_set_header Host $http_host;

        include incl/proxy-params.conf;
    }
}
