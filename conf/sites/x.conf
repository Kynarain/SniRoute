# X（原 Twitter）前门
#
# 模式：本机终结 TLS（loopback），上游发**带尾点的 SNI**（x.com.），Host 保持原样。
#
# 为什么不用 ECH：x.com 的 Cloudflare zone 并不接受共享 ECH 配置，实测带 ECH 的
# 请求会被回 403（浏览器表现为 ERR_HTTP_RESPONSE_CODE_FAILURE）。
# 为什么用尾点：GFW 拦的是精确的 x.com / www.x.com，而 ClientHello 里写
# "x.com." 这种带根点的写法不会被拦 —— 同一台 IP 上实测 3/3 返回 200。
# 注意：只有 x.com / www.x.com / api.x.com / t.co 适用；twitter.com 与
# ton/caps/upload/api.twitter.com 即使带尾点也被重置，未纳入。

# 注意：这里**故意不配置 keepalive**。
# 这几个站点给每个域名发不同的 SNI（带根点），而 nginx 的上游连接池会跨请求复用同一条
# TLS 连接 —— 复用时不重新握手，SNI 还是上一条的，Cloudflare 就会回 421 Misdirected Request。
# 实测去掉连接池后恢复正常，代价是每个请求重新握手（可以接受）。
upstream x_edge {
    include upstreams/x.list;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name x.com *.x.com t.co *.t.co;

    ssl_certificate     certs/x.crt;
    ssl_certificate_key certs/x.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://x_edge;

        proxy_ssl_server_name on;
        proxy_ssl_name $host.;
        # 关掉 TLS 会话复用：这些站点每条请求的 SNI 可能不同，复用别的域名
        # 的会话会让 Cloudflare 回 421 Misdirected Request（实测约一半请求中招）。
        proxy_ssl_session_reuse off;          # 关键：带根点的 SNI，不触发封锁
        proxy_set_header Host $http_host;

        include incl/proxy-params.conf;
    }
}
