# OneDrive 网页（onedrive.live.com）
#
# 模式：本机终结 TLS，上游不发 SNI（proxy_ssl_server_name off），靠 Host 头路由。
# 原因：带 SNI 的连接会被重置，而不发 SNI、只带 Host 的请求能拿到真实 302/页面
#
# 上游地址：conf/upstreams/onedrive.list（实测可用的边缘，失效时用
# scripts\sniroute.py site <域名> 重新探测）

upstream onedrive_edge {
    include upstreams/onedrive.list;

    keepalive 8;
    keepalive_timeout 60s;
    keepalive_requests 300;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name onedrive.live.com *.onedrive.live.com;

    ssl_certificate     certs/onedrive.crt;
    ssl_certificate_key certs/onedrive.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://onedrive_edge;

        proxy_ssl_server_name off;

        include incl/proxy-params-slow.conf;
    }
}
