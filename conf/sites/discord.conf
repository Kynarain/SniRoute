# Discord（discord.com / discord.gg / discordapp）。
#
# 与图片站同一模式：本机终结 TLS，上游不发 SNI，靠 Host 头路由。
#
# 已知限制（写在这里，免得以后有人以为是配置坏了）：
#   cdn.discordapp.com 与 media.discordapp.net 由 Cloudflare 按 SNI 分区，
#   无 SNI 的请求一律返回 403。也就是说本机代理能打开 discord.com 的页面、
#   能连 gateway，但头像、表情、附件这些 CDN 资源无法加载。

upstream discord_edge {
    include upstreams/discord.list;

    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 500;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name discord.com *.discord.com
                discord.gg *.discord.gg
                discordapp.com *.discordapp.com
                discordapp.net *.discordapp.net;

    ssl_certificate     certs/discord.crt;
    ssl_certificate_key certs/discord.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://discord_edge;

        proxy_ssl_server_name off;

        # Cloudflare 对"无 SNI + 看起来像机器人"的请求直接回 421/403。
        # 实测：带上浏览器导航的这组头，Cloudflare 才按 Host 正确路由。
        # 所以在转发时统一补齐，不依赖客户端是否发送。
        proxy_set_header Sec-Fetch-Site          none;
        proxy_set_header Sec-Fetch-Mode          navigate;
        proxy_set_header Sec-Fetch-User          ?1;
        proxy_set_header Sec-Fetch-Dest          document;
        proxy_set_header Upgrade-Insecure-Requests 1;

        # WebSocket：gateway 与语音都走 upgrade，不传这两个头会 400。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        include incl/proxy-params-ws.conf;


        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
