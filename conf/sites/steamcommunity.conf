# Steam 社区（steamcommunity.com）
#
# 模式：本机终结 TLS，上游不发 SNI。
# 原因：这个域名带 SNI 会被重置，而不发 SNI 的请求能拿到完整的 200 页面
# （实测 3 个 Akamai 边缘各 3 次全部成功）。
#
# 注意：Steam 商店（store.steampowered.com）不在这里。它带 SNI 是正常的，
# 只是系统 DNS 给的地址不一定对，所以走 dns 模式（只改解析、不做代理）。

upstream steamcommunity_edge {
    include upstreams/steamcommunity.list;

    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 300;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name steamcommunity.com *.steamcommunity.com;

    ssl_certificate     certs/steamcommunity.crt;
    ssl_certificate_key certs/steamcommunity.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://steamcommunity_edge;

        proxy_ssl_server_name off;


        # 超时收紧版的公共参数：某个上游静默不响应时能秒级切换。
        include incl/proxy-params-community.conf;

        # 社区页有 WebSocket（聊天/通知），保留升级头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
