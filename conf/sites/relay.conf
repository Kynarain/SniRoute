# 中继站点（需要 data/relay.json 启用 + SSH 隧道在跑）
#
# 这些域名在当前网络里没有直连出路：
#   · googlevideo：必须发真 SNI 才能选到视频服务器，但真 SNI 会被断
#   · Twitch VOD/剪辑/登录：CloudFront 边缘 IP 被整段封锁（换任何 SNI 都重置）
#   · Discord 更新域名：同理
#
# 做法：本机 nginx 仍然终结浏览器侧 TLS，向上游发**真实 SNI**，但对端是
# tools/relay.py —— 它从 ClientHello 里读出 SNI，经 SOCKS5（ssh -D）连到目标 443，
# 再把字节双向透传。SNI 只出现在隧道内部，外面看不到。
#
# 注意：隧道没起时这些域名会快速 502，比之前挂二十几秒好。

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name *.googlevideo.com googlevideo.com;

    ssl_certificate     certs/relaycert.crt;
    ssl_certificate_key certs/relaycert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass https://127.0.0.1:18955;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;          # 这个 SNI 会给 relay.py 用来路由
        proxy_set_header Host $host;
        include incl/proxy-params-video.conf;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name stable.dl2.discordapp.net dl.dl2.discordapp.net dl.discordapp.net;

    ssl_certificate     certs/relaycert.crt;
    ssl_certificate_key certs/relaycert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass https://127.0.0.1:18955;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host $host;
        include incl/proxy-params-community.conf;
    }
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name vod-secure.twitch.tv clips-media-assets2.twitch.tv
                api.twitch.tv passport.twitch.tv id.twitch.tv ids.twitch.tv;

    ssl_certificate     certs/relaycert.crt;
    ssl_certificate_key certs/relaycert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass https://127.0.0.1:18955;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host $host;
        include incl/proxy-params-video.conf;
    }
}
