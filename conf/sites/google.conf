# Google（google.com / googleapis / gstatic / youtube / googleusercontent）。
#
# 与图片站同一模式：本机终结 TLS，上游**不发 SNI**。
# 区别在于 Google 不靠 SNI 路由，而是靠 Host / :authority，所以能这么用；
# 这也正是它能被本机代理接管的原因。
#
# 注意：google.com 会 302 到 google.com.hk，所以 server_name 必须同时覆盖
# 两个域，否则浏览器跳转后就会掉回被墙的地址。

upstream google_edge {
    include upstreams/google.list;

    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 500;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name google.com *.google.com
                google.com.hk *.google.com.hk
                gstatic.com *.gstatic.com
                googleapis.com *.googleapis.com
                googleusercontent.com *.googleusercontent.com
                youtube.com *.youtube.com
                youtu.be
                ytimg.com *.ytimg.com
                ggpht.com *.ggpht.com;

    ssl_certificate     certs/google.crt;
    ssl_certificate_key certs/google.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://google_edge;

        # 关键：不带 SNI。带了就会被切断（实测 RST）。
        proxy_ssl_server_name off;

        include incl/proxy-params-video.conf;


        # Google 的响应头很大（CSP、多个 Set-Cookie，gemini 尤其），
        # 默认 16k 会触发 "upstream sent too big header" 直接 502。

        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}
