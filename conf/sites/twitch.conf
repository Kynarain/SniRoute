# Twitch 页面（*.twitch.tv）
#
# 模式：本机终结 TLS，上游不发 SNI。
# 原因：Fastly 上这个域名带 SNI 会被重置，不发 SNI 却能返回真实内容。
# 注意：jtvnw.net / ttvnw.net（静态图与直播 HLS）不在这个块里 —— 它们在
# twitchcdn 站点用 dns 模式，因为 CloudFront 强制要求 SNI，去掉 SNI 直播会全断。

upstream twitch_edge {
    include upstreams/twitch.list;
    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 300;
}

server {
    listen      127.0.0.1:443 ssl;
    listen      [::1]:443 ssl;
    http2       on;

    server_name twitch.tv *.twitch.tv;

    ssl_certificate     certs/twitch.crt;
    ssl_certificate_key certs/twitch.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sniroute_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location / {
        proxy_pass https://twitch_edge;
        proxy_ssl_server_name off;
        include incl/proxy-params-community.conf;
        # Twitch 页面有长轮询/websocket，保留升级头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }
}