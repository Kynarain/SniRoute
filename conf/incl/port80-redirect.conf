# http → https 升级（可选，默认不启用）。
#
# 启用方式：把 conf/nginx.conf 里那行 `#include incl/port80-redirect.conf;`
# 前面的 # 去掉。
#
# 为什么默认关掉：Windows 上 80 端口经常根本绑不上。HTTP.sys（PID 4）会占着它，
# 而且 WinNAT / Hyper-V 会把它划进"排除端口段"，此时绑定失败报的是
#    bind() to 127.0.0.1:80 failed (10013: ... forbidden by its access permissions)
# 这不是配置写错了，也不该让整个代理起不来。
#
# 关掉它只损失一件事：手打 http://pixiv.net 不会自动跳到 https。
# https:// 本身完全不受影响。
#
# 查本机可用性：
#   netsh int ipv4 show excludedportrange protocol=tcp
#   Get-NetTCPConnection -State Listen -LocalPort 80

server {
    listen      127.0.0.1:80;
    listen      [::1]:80;
    server_name _;
    access_log  off;
    return 301 https://$host$request_uri;
}
