# 与 proxy-params.conf 相同，但超时收紧。
# 用途：上游有多个地址、其中某个会静默不响应的站点（Steam 社区）。
# 默认 180 秒/60 秒的超时会让整页卡几分钟。

proxy_connect_timeout 4s;
# 所有站点共用的上游请求参数。
#
# 这里只放"与站点无关"的东西。凡是某个站点才需要的行为（比如图片站的
# Referer），写在那份站点配置里，不要塞进来 —— 否则下一个人得读完全部
# 站点才知道某个 header 从哪来。

proxy_http_version 1.1;

# Host 原样透传：上游看到的是用户真正访问的域名，而不是本机地址
proxy_set_header Host            $http_host;
proxy_set_header User-Agent      $http_user_agent;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# 关闭上游连接复用后的 keep-alive 冲突
proxy_set_header Connection      "";

# 开启缓冲。原来这里是 off，实测大图（>100KB）中位 13.6 秒、最慢 45.8 秒。
# off 的意思是"上游给多少就立刻转给客户端多少"，跨境链路上任何一次抖动都会
# 被原样传导给浏览器，而且客户端读得慢会反压上游的 TCP 窗口。on 让 nginx 先
# 把响应收进内存再发，把两段链路解耦。
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 16 64k;
proxy_busy_buffers_size 128k;
# 仍然不落盘：宁可让 nginx 阻塞读取，也不要把大图写到磁盘再读一遍
proxy_max_temp_file_size 0;

# 上游 socket 长连接保持（与 upstream 里的 keepalive 配合）
proxy_socket_keepalive on;

# 大文件在慢链路上可能需要更久才有下一块数据；60 秒会在长尾上误判超时
proxy_read_timeout 30s;
proxy_send_timeout 30s;
