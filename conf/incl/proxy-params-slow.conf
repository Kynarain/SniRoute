# 慢握手站点的公共参数（conf/incl/proxy-params-slow.conf）
#
# 用途：上游 TLS 握手很慢的站点。MEGA 的边缘实测要 9-12 秒才握完手，
# 用默认的 4-6 秒会被 nginx 当成失败，站点直接打不开。
#
# 这里放宽连接超时，读超时保持较长以容纳大文件下载。

proxy_http_version 1.1;
proxy_set_header Connection "";
# 必须把原始 Host 传给上游：这些站点的上游靠 Host 路由，
# 不设的话 nginx 默认发 upstream 名，上游会回 400/404。
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_connect_timeout 20s;
proxy_send_timeout   60s;
proxy_read_timeout   120s;
proxy_ssl_verify     off;
proxy_hide_header    Strict-Transport-Security;
proxy_redirect       off;
# Dropbox 这类站点的响应头很大（多个 Set-Cookie + CSP），默认 4k/8k 缓冲会让 nginx
# 报 "upstream sent too big header" 并回 502，所以把缓冲放大。
proxy_buffer_size    32k;
proxy_buffers        8 32k;
proxy_busy_buffers_size 64k;
proxy_buffering      on;
