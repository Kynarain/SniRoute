# sniroute — 本地 SNI 反向代理
#
# 运行方式（prefix 必须指向仓库根目录，证书与日志才找得到）：
#   nginx -p <仓库根目录> -c conf/nginx.conf
# 只校验配置：
#   nginx -p <仓库根目录> -c conf/nginx.conf -t
#
# 设计要求：
#   1. 只监听回环地址。任何一份站点配置都不得写 0.0.0.0 —— 那是把代理端口
#      暴露给整个局域网，等于给邻居开一扇不用密码的窗。
#   2. 不记录 $request（带查询串），只留域名与状态码，避免日志变成浏览记录。
#   3. 站点之间互不共享证书，这是一条功能约束而不是洁癖：浏览器在"同一 IP、
#      同一张证书对两个域名都有效"时会把 HTTP/2 连接合并复用，上游随后看到
#      "连接 SNI 是 A、:authority 是 B"，Cloudflare 一类的前端直接回 421。
#      窄证书是让浏览器没有合并的理由。

worker_processes 2;
worker_shutdown_timeout 10s;

error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 8192;
}

http {
    server_tokens off;

    # 有意不含 $request：代理的日志不该成为浏览历史
    log_format sniroute '$remote_addr [$time_local] "$host" $status $body_bytes_sent ${request_time}s';
    # server_name 数量随支持站点增长（Google 一家就有 20 多个名字），
    # 默认 32 字节的桶会不够用，nginx 启动直接报 bundle 错误。
    server_names_hash_bucket_size 64;

    access_log logs/access.log sniroute;

    # WebSocket upgrade header (Discord gateway needs it)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    open_log_file_cache max=20 inactive=60s;

    client_max_body_size 64m;
    client_header_timeout 10s;
    client_body_timeout 20s;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # http → https 升级是可选的，默认关闭：Windows 上 80 端口经常被 HTTP.sys
    # 或 WinNAT 的排除端口段占住，绑不上会让整份配置校验失败。
    # 需要时取消下面这行的注释，细节见 incl/port80-redirect.conf。
    #include incl/port80-redirect.conf;

    include sites/pixiv.conf;
    include sites/pximg.conf;
include sites/google.conf;
include sites/discord.conf;
include sites/steamcommunity.conf;
include sites/steamavatars.conf;
include sites/twitch.conf;
include sites/relay.conf;
include sites/twimg.conf;
include sites/x.conf;
include sites/grok.conf;
include sites/dropbox.conf;
include sites/megaapi.conf;
include sites/mega.conf;
include sites/onedrive.conf;

    # ---------------------------------------------------------------------------
    # DoH 前置（DOH_FRONT）
    #
    # 为什么需要它：Chrome 的 DoH 只走 HTTP/2，而 tools/doh_ech.py 用的是 Python
    # 标准库的 HTTP/1.1 服务，TLS 层根本没有 ALPN —— 浏览器会判定该端点不可用。
    # 于是让 nginx 在 5444 终结 TLS 并协商 h2，再把明文 HTTP/1.1 转给后端的
    # Python（127.0.0.1:5454）。浏览器看到的是合法的 h2 DoH 端点。
    # ---------------------------------------------------------------------------
    server {
        listen      127.0.0.1:5444 ssl;
        http2       on;
        server_name doh.sniroute.lan 127.0.0.1;
    
        ssl_certificate     certs/doh.crt;
        ssl_certificate_key certs/doh.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:sniroute_tls:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;
    
        location /dns-query {
            proxy_pass http://127.0.0.1:5454;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;          # DNS 响应很小，没必要缓冲
            proxy_read_timeout 30s;
        }
    }
}
