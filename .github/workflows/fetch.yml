name: fetch

# 用 GitHub 的 runner（墙外）访问一个 URL，然后作为 artifact 交回本机。
# 本机取回：gh run download <run-id> -n fetch
#
# 支持 GET 与 POST（POST 用于没法用 GET 的接口，例如 Tor 的 moat 桥分发 API）。
# 例：
#   gh workflow run fetch.yml -f url=https://bridges.torproject.org/moat/circumvention/request \
#       -f method=POST -f body='{"data":[{"version":"0.0.1","type":"client","transport":"webtunnel"}]}'
#
# 定位说明：这是"取文件"的通道，不是代理/隧道。runner 是临时的、没有入向连接，
# 也不适合跑常驻服务（GitHub 的 AUP 不允许把 Actions 当通用计算/代理用）。

on:
  workflow_dispatch:
    inputs:
      url:
        description: '要访问的 URL（https）'
        required: true
      filename:
        description: '保存的文件名（留空则用 URL 最后一段）'
        required: false
        default: ''
      timeout:
        description: '超时秒数'
        required: false
        default: '600'
      method:
        description: 'HTTP 方法：GET 或 POST（默认 GET）'
        required: false
        default: 'GET'
      body:
        description: 'POST 时的请求体（原样发送）'
        required: false
        default: ''
      content_type:
        description: 'POST 时的 Content-Type（默认 application/json）'
        required: false
        default: 'application/json'
      user_agent:
        description: 'User-Agent（有些 API 会检查）'
        required: false
        default: 'sniroute-fetch/1.0'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.filename }}
          TIMEOUT: ${{ inputs.timeout }}
          METHOD: ${{ inputs.method }}
          BODY: ${{ inputs.body }}
          CTYPE: ${{ inputs.content_type }}
          UA: ${{ inputs.user_agent }}
        run: |
          set -euo pipefail
          name="$NAME"
          if [ -z "$name" ]; then
            name="$(basename "${URL%%\?*}")"
            [ -z "$name" ] && name="download.bin"
          fi
          echo "method: $METHOD  url: $URL"
          if [ "$METHOD" = "POST" ]; then
            printf '%s' "$BODY" > request.json
            curl -fsSL --retry 3 --retry-delay 5 --max-time "$TIMEOUT" \
                 -X POST -H "Content-Type: $CTYPE" -H "User-Agent: $UA" \
                 --data-binary @request.json -o "$name" "$URL"
          else
            curl -fL --retry 3 --retry-delay 5 --max-time "$TIMEOUT" \
                 -H "User-Agent: $UA" -o "$name" "$URL"
          fi
          ls -l "$name"
          echo "sha256: $(sha256sum "$name" | cut -d' ' -f1)"
          echo "size: $(stat -c %s "$name") bytes"
          echo "---- head of response ----"
          head -c 400 "$name" || true
          echo
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetch
          path: ${{ env.NAME }}
          retention-days: 3
          if-no-files-found: error
